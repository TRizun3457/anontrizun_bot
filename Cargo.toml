[package]
name = "anontrizun_bot"
version = "0.2.0"
edition = "2024"
rust-version = "1.94"
license = "GPL-3.0-only"
description = "Telegram bot for exchanging anonymous messages with its owner"
readme = "README.md"

[lib]
name = "anontrizun_bot"
path = "src/lib.rs"

[[bin]]
name = "anontrizun_bot"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
dashmap = "6.1"
dotenvy = "0.15"
futures = "0.3"
rand = "0.10"
sqlx = { version = "0.9", default-features = false, features = [
    "macros",
    "migrate",
    "runtime-tokio",
    "sqlite",
] }
teloxide = { version = "0.17", default-features = false, features = ["rustls"] }
tokio = { version = "1.47", features = [
    "macros",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"

[dev-dependencies]
serde_json = "1.0"
sha2 = "0.10"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
