[project]
name = "anontrizun-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.30.0",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.16.0",
    "ty>=0.0.63",
]

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "database_rs/Cargo.toml" },
    { file = "database_rs/Cargo.lock" },
    { file = "database_rs/build.rs" },
    { file = "database_rs/src/**/*.rs" },
    { file = "database_rs/migrations/*.sql" },
]

[tool.maturin]
manifest-path = "database_rs/Cargo.toml"
module-name = "database"

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "database_rs/Cargo.toml" },
    { file = "database_rs/build.rs" },
    { file = "database_rs/src/**/*.rs" },
    { file = "database_rs/migrations/*.sql" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"main.py" = ["E402"]
"potato/service.py" = ["BLE001"]
